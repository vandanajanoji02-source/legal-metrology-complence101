# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Enable parallel project builds
org.gradle.parallel=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library.
android.nonTransitiveRClass=true

# Enable Gradle build caching
org.gradle.caching=true

# Limit workers to avoid overloading the machine
org.gradle.workers.max=4

# Kotlin compiler execution strategy
kotlin.compiler.execution.strategy=in-process

# Allow the google-services plugin to work even if the google-services.json is not present.
# The app handles missing Firebase gracefully via FirebaseManager.
googleServices.missing.passthrough=true

# KSP + AGP 9.x compatibility: KSP uses kotlin.sourceSets DSL which AGP 9.x restricts.
# This flag allows it to work until KSP fully migrates to android.sourceSets.
android.disallowKotlinSourceSets=false

# Enable incremental compilation
kotlin.incremental=true


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
